name: aweille

services:
  web:
    build: .
    user: "${AWEILLE_UID:-1000}:${AWEILLE_GID:-1000}"
    ports:
      - "127.0.0.1:${AWEILLE_PORT:-8080}:8000"
    volumes:
      - type: bind
        source: ${AWEILLE_DATA_DIR:-${HOME}/.local/share/aweille}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
