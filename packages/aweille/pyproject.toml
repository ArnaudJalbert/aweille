[project]
name = "aweille"
version = "0.1.0"
description = "Planned running workouts with exact targets and Montreal scheduling."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
aweille-init-db = "aweille.interface_adapters.create_database:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
