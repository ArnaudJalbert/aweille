{% extends 'base.html' %}
{% block title %}Schedule | Aweille{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', path='weekly.js') }}"></script>{% endblock %}
{% block content %}
    <header class="page-heading">{% include 'menu.html' %}<h1 id="week-heading" tabindex="-1"></h1></header>
    <div id="status" class="notice" role="status" aria-live="polite" aria-atomic="true">JavaScript is required to load your runs.</div>
    <div id="days" class="days"></div>
    <nav id="week-navigation" class="week-nav" aria-label="Week navigation" hidden>
      <button id="previous-week" type="button">Previous week</button>
      <button id="this-week" type="button">This week</button>
      <button id="next-week" type="button">Next week</button>
    </nav>
{% endblock %}
