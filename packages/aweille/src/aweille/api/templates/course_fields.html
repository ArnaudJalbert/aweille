<fieldset id="form-fields" disabled{% if editing %} hidden{% endif %}>
  <div class="paired-fields">
    <div class="field-grid">
      <label class="field" for="planned_date">Planned date</label>
      <input id="planned_date" name="planned_date" type="date" required aria-describedby="planned_date-error">
      <span id="planned_date-error" class="field-error" hidden></span>
    </div>
    <div class="field-grid">
      <label class="field" for="planned_start_time">Start time <span class="optional">Optional</span></label>
      <input id="planned_start_time" name="planned_start_time" type="time" step="60" aria-describedby="planned_start_time-error">
      <span id="planned_start_time-error" class="field-error" hidden></span>
    </div>
  </div>
  <div class="field-grid">
    <label class="field" for="course_type">Course type</label>
    <select id="course_type" name="course_type" required aria-describedby="course_type-error">
      <option value="">Choose a course type</option>
      <option value="easy">Easy</option>
      <option value="hard">Hard</option>
      <option value="interval">Interval</option>
      <option value="long">Long</option>
    </select>
    <span id="course_type-error" class="field-error" hidden></span>
  </div>
  <section class="form-section" aria-labelledby="sections-heading">
    <h2 id="sections-heading">Sections</h2>
    <p class="muted">One step per section, in running order.</p>
    <div id="section-list"></div>
    <div class="add-section"><button id="add-section" class="quiet-action" type="button">Add section</button></div>
  </section>
  <section class="form-section" aria-labelledby="notes-heading">
    <h2 id="notes-heading">Notes</h2>
    <div class="form-notes">
      <div class="field-grid">
        <label class="field" for="user_note">Personal note <span class="optional">Optional</span></label>
        <textarea id="user_note" name="user_note" aria-describedby="user_note-error"></textarea>
        <span id="user_note-error" class="field-error" hidden></span>
      </div>
      <div class="field-grid">
        <label class="field" for="trainer_note">Trainer note <span class="optional">Optional</span></label>
        <textarea id="trainer_note" name="trainer_note" aria-describedby="trainer_note-error"></textarea>
        <span id="trainer_note-error" class="field-error" hidden></span>
      </div>
    </div>
  </section>
</fieldset>
    <template id="section-template">
      <fieldset class="section-editor">
        <legend></legend>
        <div class="section-inputs">
          <div class="field-grid">
            <label class="field" data-label="distance_m">Distance <span class="optional">km</span></label>
            <input data-field="distance_m" inputmode="decimal" required>
            <span class="field-error" data-error="distance_m" hidden></span>
          </div>
          <div class="field-grid">
            <label class="field" data-label="target_pace_seconds_per_km">Pace <span class="optional">m:ss/km</span></label>
            <input data-field="target_pace_seconds_per_km" placeholder="6:30" required>
            <span class="field-error" data-error="target_pace_seconds_per_km" hidden></span>
          </div>
        </div>
        <div class="section-actions">
          <button data-action="remove" class="quiet-action" type="button">Remove</button>
          <div class="move-actions">
            <button data-action="up" class="icon-button" type="button" title="Move section up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
            <button data-action="down" class="icon-button" type="button" title="Move section down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
          </div>
        </div>
      </fieldset>
    </template>
