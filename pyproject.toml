[tool.uv.workspace]
members = ["packages/aweille"]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.pytest.ini_options]
testpaths = ["packages/aweille/tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"
